# CourierGiant — Render Blueprint
# Native Node so `next build` runs before `next start`.
# The dashboard service was starting with yarn/next start and had no .next output.

services:
  - type: web
    name: couriergiant
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://creliora-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://couriergiant.com
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
