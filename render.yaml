# CourierGiant — Render Blueprint
# This service must run as Docker. Native Node uses `yarn start` and has no
# production `.next` build. Switch the dashboard Source runtime back to Docker.

services:
  - type: web
    name: couriergiant
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://creliora-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://couriergiant.com
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
